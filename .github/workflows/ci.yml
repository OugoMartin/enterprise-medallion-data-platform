name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate reproducible sample data
        run: python -m src.ingestion.generate_sample_data
      - name: Profile generated data
        run: python -c "from pathlib import Path; from src.validation.profile_data import profile_file; print(profile_file(Path('data/generated/orders.csv')))"
      - name: Run unit tests
        run: pytest -q
